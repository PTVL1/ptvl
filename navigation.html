<script>
(()=>{
const d=window.parent.document,w=window.parent;
if(d.getElementById('prisma-navigation')?.dataset.version==='students-type') return;
['prisma-navigation','prisma-contact','prisma-top'].forEach(id=>d.getElementById(id)?.remove());
d.documentElement.removeAttribute('data-prisma-theme');
const nav=d.createElement('nav');nav.id='prisma-navigation';nav.className='prisma-nav';nav.setAttribute('aria-label','Navegação principal');
nav.dataset.version='students-type';
nav.innerHTML='<div class="prisma-nav-inner"><a class="prisma-brand" href="#inicio">PRISMA<span class="brand-dot"></span></a><span class="nav-note">O teu laboratório criativo</span><button id="prisma-menu" aria-expanded="false" aria-controls="prisma-links">Menu</button><div id="prisma-links" class="prisma-links"><a href="#ferramentas" data-lab="0">Poesia</a><a href="#ferramentas" data-lab="1">Imagem &amp; cor</a><a href="#ferramentas" data-lab="2">Quiz</a></div></div><div id="prisma-progress" role="progressbar" aria-label="Progresso da página" aria-valuemin="0" aria-valuemax="100"></div>';
d.body.append(nav);
const typeLink=d.createElement('a');typeLink.href='#ferramentas';typeLink.dataset.lab='3';typeLink.textContent='Tipografia';d.getElementById('prisma-links').append(typeLink);
const skip=d.createElement('a');skip.className='prisma-skip';skip.href='#ferramentas';skip.textContent='Saltar para as ferramentas';d.body.append(skip);
const menu=d.getElementById('prisma-menu'),links=d.getElementById('prisma-links');
function close(){links.classList.remove('open');menu.setAttribute('aria-expanded','false')}
menu.onclick=()=>{const open=links.classList.toggle('open');menu.setAttribute('aria-expanded',String(open))};
nav.addEventListener('keydown',e=>{if(e.key==='Escape'){close();menu.focus()}});
const top=d.createElement('button');top.id='prisma-top';top.className='prisma-float';top.textContent='Voltar ao início';d.body.append(top);
const scroller=()=>d.querySelector('[data-testid="stAppViewContainer"]')||d.scrollingElement;
function go(id){const el=d.getElementById(id);if(el){el.scrollIntoView({behavior:w.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})}}
[nav,skip].forEach(el=>el.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();if(a.dataset.lab!==undefined){d.querySelectorAll('[role="tablist"] [role="tab"]')[Number(a.dataset.lab)]?.click()}go(a.hash.slice(1));close()}}));
top.onclick=()=>scroller().scrollTo({top:0,behavior:w.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
function progress(){const s=scroller(),total=s.scrollHeight-s.clientHeight,p=total>0?Math.round(s.scrollTop/total*100):0;const bar=d.getElementById('prisma-progress');bar.style.width=p+'%';bar.setAttribute('aria-valuenow',String(p));top.hidden=s.scrollTop<300}
d.addEventListener('scroll',progress,true);new w.ResizeObserver(progress).observe(d.body);progress();
const loading=d.createElement('div');loading.className='prisma-loading';loading.setAttribute('aria-hidden','true');d.body.append(loading);
const seen=new WeakSet();
const observer=new w.IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('prisma-reveal');observer.unobserve(entry.target)}}),{threshold:.12});
function enhance(){
 d.querySelectorAll('[data-testid="stHeading"],[data-testid="stMetric"],[data-testid="stImage"]').forEach(el=>{if(!seen.has(el)){seen.add(el);observer.observe(el)}});
 d.body.classList.toggle('prisma-busy',!!d.querySelector('[data-testid="stStatusWidget"],[data-testid="stSpinner"],[data-testid="stSkeleton"]'));
 progress();
}
let scheduled=false;
new w.MutationObserver(()=>{if(!scheduled){scheduled=true;w.requestAnimationFrame(()=>{scheduled=false;enhance()})}}).observe(d.querySelector('[data-testid="stApp"]')||d.querySelector('.stApp')||d.body,{childList:true,subtree:true});
enhance();
})();
</script>
